$('#dialogOK').onclick=()=>{let val=$('#dialogValue')?.value||'';let result=dialogCallback?.(val);if(result===false)return;closeDialog()};$('#dialogCancel').onclick=closeDialog;
$('#dialogLayer').onclick=e=>{if(e.target===$('#dialogLayer'))closeDialog()};$('#dialogLayer').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target?.tagName!=='TEXTAREA'){e.preventDefault();$('#dialogOK').click()}});
const lookup=id=>notes.find(n=>n.id===id);
function setPanel(id){hideMenu();document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));activePanel=id;$('#navNotes').classList.toggle('active',!id);$('#navSettings').classList.toggle('active',id==='settingsPanel');if(!id){$('#notesScroll').style.overflow='auto';renderList()}}
function closePanel(){if(activePanel==='editorPanel'){saveEditor(false);setPanel(null)}else if(activePanel==='trashPanel')setPanel('settingsPanel');else setPanel(null)}
function reader(id){let n=lookup(id);if(!n)return toast('笔记不存在');activeId=id;$('#readerName').textContent=n.title;$('#readTitle').textContent=n.title;$('#readMeta').textContent=`${getStamp(n)} · ${n.category} · 本地 Markdown`;let ph=$('#readerPhoto');ph.style.display=n.image&&IMAGES[n.image]?'block':'none';if(n.image&&IMAGES[n.image])ph.src=IMAGES[n.image];$('#readBody').innerHTML=md(n.content);setPanel('readerPanel')}
function editor(id){let n=lookup(id);if(!n)return;activeId=id;showPreview=false;$('#editBox').classList.remove('view-preview');$('#editorViewBtn').textContent='预览';$('#editorName').textContent=n.title;$('#editorText').value=n.content||'';$('#editStatus').textContent='Markdown 源码 · 编辑内容仅保存在本浏览器';editChanged=false;setPanel('editorPanel');setTimeout(()=>$('#editorText').focus(),100)}
function saveEditor(shouldNotify=true){if(!activeId)return;let n=lookup(activeId);if(!n)return;n.content=$('#editorText').value;if(editChanged){n.time=Date.now();n.stamp='刚刚';editChanged=false;persist()}$('#editStatus').textContent='已保存到浏览器演示数据';if(shouldNotify)toast('笔记已保存（演示数据）')}
function newNote(){showDialog({title:'新建笔记',info:'笔记名对应 Markdown 文件名，正文标题独立。',positive:'创建并编辑',onConfirm:v=>{let error=invalidName(v);if(error){$('#dialogError').textContent=error;return false}let n={id:'custom-'+Date.now(),title:v.trim(),category:currentCat==='全部笔记'?'未分类':currentCat,tags:currentCat==='全部笔记'?[]:[currentCat],stamp:'刚刚',time:Date.now(),created:Date.now(),pinned:false,image:null,content:''};notes.unshift(n);persist();editor(n.id)}})}
function rename(id){let n=lookup(id);if(!n)return;showDialog({title:'重命名笔记',info:'此操作仅修改文件名，不会自动改写正文中的标题。',value:n.title,onConfirm:v=>{let err=invalidName(v,id);if(err){$('#dialogError').textContent=err;return false}n.title=v.trim();persist();if(activePanel==='editorPanel')$('#editorName').textContent=n.title;else if(activePanel==='readerPanel')$('#readerName').textContent=$('#readTitle').textContent=n.title;renderList();toast('已重命名')}})}
function move(id){let n=lookup(id);if(!n)return;showDialog({title:'移动到笔记本',info:'选择一个笔记本分类（仅对演示数据生效）。',type:'select',value:n.category,options:['工作','生活','灵感','未分类'],onConfirm:v=>{n.category=v;n.tags=[v];persist();renderList();toast('笔记已移动')}})}
function remove(id){let n=lookup(id);if(!n)return;showDialog({title:'移入回收站？',info:`“${n.title}”将从列表移除，可在设置中的回收站恢复。`,type:'none',positive:'移入回收站',onConfirm:()=>{notes=notes.filter(x=>x.id!==id);trash.unshift(n);persist();setPanel(null);toast('已移入回收站')}})}
function noteMenu(id,anchor){let n=lookup(id);if(!n)return;menu([{text:n.pinned?'取消置顶':'置顶笔记',icon:'pin',fn:()=>{n.pinned=!n.pinned;persist();renderList();toast(n.pinned?'已置顶':'已取消置顶')}},{text:'重命名',icon:'pencil',fn:()=>rename(id)},{text:'移动笔记本',icon:'folder',fn:()=>move(id)},{text:'导出 Markdown',icon:'download',fn:()=>exportOne(n)},{text:'移入回收站',icon:'trash',danger:true,fn:()=>remove(id)}],anchor)}
const displayPlainInline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/~~(.+?)~~/g,'<del>$1</del>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
function md(text){let src=String(text||'').split(/\r?\n/);let out=[],list=false,code=false;for(let line of src){if(/^```/.test(line)){if(list){out.push('</ul>');list=false}out.push(code?'</code></pre>':'<pre><code>');code=!code;continue}if(code){out.push(esc(line)+'\n');continue}if(/^\s*[-*] (.+)/.test(line)){if(!list){out.push('<ul>');list=true}let m=line.match(/^\s*[-*] (.+)/);out.push(`<li>${displayPlainInline(m[1])}</li>`);continue}if(list){out.push('</ul>');list=false}let h=line.match(/^(#{1,6})\s+(.*)/);if(h){let level=Math.min(h[1].length,3);out.push(`<h${level}>${displayPlainInline(h[2])}</h${level}>`)}else if(/^>\s?/.test(line))out.push(`<blockquote>${displayPlainInline(line.replace(/^>\s?/,''))}</blockquote>`);else if(line.trim())out.push(`<p>${displayPlainInline(line)}</p>`)}if(list)out.push('</ul>');if(code)out.push('</code></pre>');return out.join('')||'<p style="color:var(--muted)">空白笔记</p>'}
function insertMarkdown(kind){let t=$('#editorText');let v=t.value,a=t.selectionStart,b=t.selectionEnd,sel=v.slice(a,b),add='',startOffset=0;if(kind==='heading'){add=`# ${sel||'标题'}`;startOffset=2}else if(kind==='bold'){add=`**${sel||'加粗文本'}**`;startOffset=2}else if(kind==='italic'){add=`*${sel||'斜体文本'}*`;startOffset=1}else if(kind==='code'){add='`'+(sel||'代码')+'`';startOffset=1}else if(kind==='list'){add='- '+(sel||'列表项');startOffset=2}else if(kind==='todo'){add='- [ ] '+(sel||'待办事项');startOffset=6}else if(kind==='quote'){add='> '+(sel||'引用文字');startOffset=2}else if(kind==='link'){add='['+(sel||'链接名称')+'](https://)';startOffset=1}t.value=v.slice(0,a)+add+v.slice(b);let pos=a+startOffset;t.focus();t.setSelectionRange(pos,pos+(!sel?Math.max(0,add.length-startOffset-(kind==='bold'?2:kind==='italic'||kind==='code'?1:kind==='link'?11:0)):sel.length));editChanged=true;$('#editStatus').textContent='未保存的修改'}
function exportOne(n){let blob=new Blob([n.content||''],{type:'text/markdown;charset=utf-8'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=n.title+'.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已生成 Markdown 下载')}
function showSort(){showDialog({title:'排序方式',type:'select',value:sort,options:['modified','created','title'],info:'modified 最近修改 · created 创建时间 · title 名称排序',onConfirm:v=>{sort=v;$('#sortLabel').textContent=sort==='modified'?'最近修改优先':sort==='created'?'最近创建优先':'名称 A-Z';renderList()}});const select=$('#dialogValue');for(const option of select.options){option.textContent=option.value==='modified'?'最近修改优先':option.value==='created'?'最近创建优先':'按标题排序'}}
function showFilter(){let tags=['全部标签',...new Set(notes.flatMap(n=>n.tags||[]))];showDialog({title:'筛选标签',info:'在当前笔记本内按标签筛选。',type:'select',value:currentTag,options:tags,onConfirm:v=>{currentTag=v;$('#filterLabel').textContent=v;renderList();setPanel(null)}})}
function openTrash(){renderTrash();setPanel('trashPanel')}
function renderTrash(){$('#trashList').innerHTML=trash.length?trash.map(n=>`<div class="setting-row"><div style="min-width:0;flex:1"><strong style="overflow:hidden;text-overflow:ellipsis;display:block;white-space:nowrap">${esc(n.title)}</strong><small>${esc(n.category||'未分类')}</small></div><button class="btn-ghost" data-restore="${esc(n.id)}">恢复</button><button class="action-link" style="color:#d94e4e" data-purge="${esc(n.id)}">删除</button></div>`).join(''):'<div class="empty">'+icon('trash')+'<strong>回收站是空的</strong><p>已删除的演示笔记会出现在这里。</p></div>'}
$('#trashList').onclick=e=>{let r=e.target.closest('[data-restore]'),p=e.target.closest('[data-purge]');if(r){let n=trash.find(x=>x.id===r.dataset.restore);if(n){if(notes.some(x=>x.title.toLowerCase()===n.title.toLowerCase()))return toast('存在同名笔记，暂不能恢复');notes.unshift(n);trash=trash.filter(x=>x.id!==n.id);persist();renderTrash();toast('已恢复')}}if(p){let id=p.dataset.purge;showDialog({title:'永久删除？',info:'此演示操作无法撤销。',type:'none',positive:'永久删除',onConfirm:()=>{trash=trash.filter(x=>x.id!==id);persist();renderTrash();toast('已永久删除')}})}};
$('#homeMore').onclick=e=>menu([{section:'整理笔记'},{text:'排序方式',icon:'sort',fn:showSort},{text:'标签筛选',icon:'filter',fn:showFilter},{text:'回收站',icon:'trash',fn:openTrash},{section:'本地数据'},{text:'备份与导入',icon:'folder',fn:()=>setPanel('settingsPanel')}],e.currentTarget);
$('#backupBtn').onclick=()=>{setPanel('settingsPanel');toast('本地笔记 · 手动导入与导出')};$('#newBtn').onclick=newNote;
$('#notesList').onclick=e=>{let m=e.target.closest('[data-more]');if(m){e.stopPropagation();noteMenu(m.dataset.more,m);return}let card=e.target.closest('[data-note]');if(card)reader(card.dataset.note);if(e.target.id==='emptyReset'){$('#searchInput').value='';currentCat='全部笔记';currentTag='全部标签';renderList()}};
$('#notesList').onkeydown=e=>{if(e.key==='Enter'&&e.target.matches('[data-note]'))reader(e.target.dataset.note)};
$('#tabList').onclick=e=>{let t=e.target.closest('[data-cat]');if(t){currentCat=t.dataset.cat;renderList();$('#notesScroll').scrollTop=0}};
$('#searchInput').oninput=()=>{renderList();$('#notesScroll').scrollTop=0};$('#searchClear').onclick=e=>{e.preventDefault();$('#searchInput').value='';renderList();$('#searchInput').focus()};
$('#readEditBtn').onclick=()=>editor(activeId);$('#editorName').onclick=()=>rename(activeId);$('#saveBtn').onclick=()=>saveEditor();$('#editorText').oninput=()=>{editChanged=true;$('#editStatus').textContent='未保存的修改'};
$('#editorViewBtn').onclick=()=>{showPreview=!showPreview;$('#editBox').classList.toggle('view-preview',showPreview);$('#editorViewBtn').textContent=showPreview?'源码':'预览';if(showPreview)$('#editorPreview').innerHTML=md($('#editorText').value)};
$('#formatBar').onclick=e=>{let b=e.target.closest('[data-md]');if(b)insertMarkdown(b.dataset.md)};
$('#navSettings').onclick=()=>setPanel('settingsPanel');$('#navNotes').onclick=()=>setPanel(null);document.querySelectorAll('[data-back]').forEach(b=>b.onclick=closePanel);
$('#themeSelect').value=readStorage(THEME,'light');device.dataset.theme=$('#themeSelect').value;
$('#themeSelect').onchange=e=>{device.dataset.theme=e.target.value;try{localStorage.setItem(THEME,JSON.stringify(e.target.value))}catch{}toast(e.target.value==='dark'?'已切换到深色模式':'已切换到浅色模式')};
$('#sortBtn').onclick=showSort;$('#filterBtn').onclick=showFilter;$('#trashBtn').onclick=openTrash;
$('#exportBtn').onclick=()=>{if(!notes.length)return toast('没有可以导出的笔记');let text=notes.map(n=>'<!-- '+n.title+'.md -->\n'+n.content).join('\n\n---\n\n');exportOne({title:'Life-Archive-演示合集',content:text})};
$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;let title=file.name.replace(/\.md$/i,'');let err=invalidName(title);if(err){toast('无法导入：'+err);e.target.value='';return}let content=await file.text();let n={id:'import-'+Date.now(),title,category:'未分类',tags:[],stamp:'刚刚',time:Date.now(),created:Date.now(),pinned:false,image:null,content};notes.unshift(n);persist();e.target.value='';editor(n.id);toast('已导入演示数据')};
$('#notesScroll').addEventListener('scroll',hideMenu,{passive:true});document.addEventListener('pointerdown',e=>{if(menuOpen&&!e.target.closest('#menu')&&!e.target.closest('[data-more]')&&!e.target.closest('#homeMore'))hideMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#dialogLayer').classList.contains('show'))closeDialog();else if(menuOpen)hideMenu();else if(activePanel)closePanel()}});
renderList();
})();
</script>
</body>
</html>
